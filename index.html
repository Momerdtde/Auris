  <script type="text/babel">

    const PAINT_STATUSES = [
      { value: "Orijinal", color: "bg-emerald-950/70 text-emerald-300 border-emerald-700/60" },
      { value: "Lokal Boyalı", color: "bg-amber-950/70 text-amber-300 border-amber-700/60" },
      { value: "Boyalı", color: "bg-orange-950/70 text-orange-300 border-orange-700/60" },
      { value: "Değişen", color: "bg-rose-950/70 text-rose-300 border-rose-700/60" },
      { value: "Sök-Tak / Rötuş", color: "bg-sky-950/70 text-sky-300 border-sky-700/60" }
    ];

    function AurisLogo({ size = "w-20 h-20" }) {
      return (
        <div className="flex justify-center mb-3">
          <div className={`${size} rounded-3xl bg-gradient-to-br from-[#16382b] to-[#091510] border border-amber-500/40 flex items-center justify-center shadow-[0_0_25px_rgba(30,134,137,0.35)]`}>
            <svg className="w-11 h-11 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.6" d="M5 17h14v-5l-2-5H7L5 12v5zm0 0v2a1 1 0 001 1h1a1 1 0 001-1v-2m11 0v2a1 1 0 01-1 1h-1a1 1 0 01-1-1v-2M7 14h.01M17 14h.01" />

    function App() {
      const { 
        initializeApp, 
        getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged,
        getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, getDocs, getDoc
      } = window.firebaseAPI;

      const firebaseConfig = {
        apiKey: "AIzaSyCbXDdwnz0LNU7IXr4KO__usfkjYYaHJpo",
        authDomain: "okudugumkitaplarapp.firebaseapp.com",
        projectId: "okudugumkitaplarapp",
        storageBucket: "okudugumkitaplarapp.firebasestorage.app",
        messagingSenderId: "292934565697",
        appId: "1:292934565697:web:a0cdc4cbc951faceccebc0",
        measurementId: "G-V0EFGVV2CR"
      };
      const appId = firebaseConfig.projectId;

      const [db, setDb] = useState(null);
      const [auth, setAuth] = useState(null);
      const [userId, setUserId] = useState(null);
      const [isAuthReady, setIsAuthReady] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isLoginMode, setIsLoginMode] = useState(true);
      const [authError, setAuthError] = useState('');
      const [message, setMessage] = useState(null);
      const [confirmation, setConfirmation] = useState(null);

      const [carInfo, setCarInfo] = useState({
        carTitle: "2016 Toyota Auris 1.33 Life",
        plate: "",
        color: "Füme (Kahverengi)",
        currentKm: 110000,
        nextOilKm: 120000,
        lastInspection: "2025-08-15",
        nextInspection: "2027-08-15",
        insuranceEnd: "2027-04-10",
        mtv1Paid: true,
        mtv1Amount: "",
        mtv2Paid: false,
        mtv2Amount: "",
        bodyParts: {}
      });

      const [maintenances, setMaintenances] = useState([]);
      const [notesList, setNotesList] = useState([]);
      const [experReports, setExperReports] = useState([]);
      const [activeModal, setActiveModal] = useState(null);

      const getTodayDate = () => new Date().toISOString().split('T')[0];
      const [editingMaintenanceId, setEditingMaintenanceId] = useState(null);
      const [maintForm, setMaintForm] = useState({
        date: getTodayDate(),
        km: "",
        title: "Periyodik Bakım",
        selectedParts: [],
        customPartInput: "",
        partsCost: "",
        laborCost: "",
        totalCost: "",
        serviceName: "",
        notes: ""
      });

      const [editingNoteId, setEditingNoteId] = useState(null);
      const [noteForm, setNoteForm] = useState({
        date: getTodayDate(),
        title: "",
        km: "",
        cost: "",
        content: ""
      });

      const [experForm, setExperForm] = useState({
        date: getTodayDate(),
        firm: "",
        km: "",
        cost: "",
        linkUrl: "",
        summary: ""
      });

      const showMessage = (content, type = 'success') => {
        setMessage({ content, type });
        setTimeout(() => setMessage(null), 4500);
      };

      const formatDisplayDate = (dateStr) => {
        if (!dateStr) return '-';
        const parts = dateStr.split('-');
        return parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : dateStr;
      };

      const formatCurrency = (val) => {
        const num = Number(val);
        if (!val || isNaN(num) || num === 0) return "0 ₺";
        return num.toLocaleString('tr-TR') + " ₺";
      };

      // =========================================================================
      // MUAYENE & SİGORTA GERİ SAYIM HESAPLAYICI
      // =========================================================================
      const getCountdownDetails = (targetDateStr) => {
        if (!targetDateStr) {
          return { totalDays: null, label: "Tarih Girilmedi", detail: "", badgeClass: "bg-gray-800 text-gray-400 border-gray-700", textClass: "text-gray-400" };
        }
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const parts = targetDateStr.split('-');
        if (parts.length !== 3) {
          return { totalDays: null, label: "Geçersiz Tarih", detail: "", badgeClass: "bg-gray-800 text-gray-400 border-gray-700", textClass: "text-gray-400" };
        }
        const target = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        const diffTime = target.getTime() - today.getTime();
        const totalDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (totalDays < 0) {
          const passed = Math.abs(totalDays);
          return {
            totalDays,
            label: `${passed} Gün Geçti!`,
            detail: "Süresi Doldu",
            badgeClass: "bg-rose-950/90 text-rose-300 border-rose-600/60",
            textClass: "text-rose-400"
          };
        }
        if (totalDays === 0) {
          return {
            totalDays: 0,
            label: "Bugün Son Gün!",
            detail: "Muayene Günü",
            badgeClass: "bg-rose-950/90 text-rose-300 border-rose-600/60",
            textClass: "text-rose-400"
          };
        }

        // Ay ve Gün Ayrıntısı
        const months = Math.floor(totalDays / 30);
        const remDays = totalDays % 30;
        const detailStr = months > 0 ? `${months} Ay ${remDays} Gün` : `${totalDays} Gün`;

        if (totalDays <= 30) {
          return {
            totalDays,
            label: `${totalDays} Gün Kaldı`,
            detail: detailStr,
            badgeClass: "bg-amber-950/90 text-amber-300 border-amber-500/60",
            textClass: "text-amber-400"
          };
        }
        return {
          totalDays,
          label: `${totalDays} Gün Kaldı`,
          detail: detailStr,
          badgeClass: "bg-emerald-950/80 text-emerald-300 border-emerald-600/50",
          textClass: "text-emerald-300"
        };
      };

      // =========================================================================
      // OTOMATİK VERİ KURTARMA MOTORU (Önceki verileri korur ve birleştirir)
      // =========================================================================
      const recoverPreviousData = async (firestoreDb, uid) => {
        let recoveredCount = 0;
        try {
          const oldDocA = await getDoc(doc(firestoreDb, `artifacts/${appId}/users/${uid}/carData/main`));
          if (oldDocA.exists()) {
            const d = oldDocA.data();
            if (d.carInfo) await setDoc(doc(firestoreDb, `artifacts/${appId}/users/${uid}/aurisGarage/carInfo`), d.carInfo, { merge: true });
            if (Array.isArray(d.maintenances)) {
              for (const m of d.maintenances) {
                const mId = m.id || ('rec_' + Math.random().toString(36).substring(2, 9));
                await setDoc(doc(firestoreDb, `artifacts/${appId}/users/${uid}/aurisMaintenances`, String(mId)), {
                  date: m.date || getTodayDate(),
                  km: Number(m.km) || 0,
                  title: m.title || m.type || "Bakım Kaydı",
                  selectedParts: m.selectedParts || m.parts || [],
                  partsCost: Number(m.partsCost) || 0,
                  laborCost: Number(m.laborCost) || 0,
                  totalCost: Number(m.totalCost || m.cost) || 0,
                  serviceName: m.serviceName || "",
                  notes: m.notes || m.note || ""
                }, { merge: true });
                recoveredCount++;
              }
            }
          }

          const oldMaintSnap = await getDocs(collection(firestoreDb, `artifacts/${appId}/users/${uid}/maintenances`));
          if (!oldMaintSnap.empty) {
            for (const docItem of oldMaintSnap.docs) {
              const m = docItem.data();
              await setDoc(doc(firestoreDb, `artifacts/${appId}/users/${uid}/aurisMaintenances`, docItem.id), {
                date: m.date || getTodayDate(),
                km: Number(m.km) || 0,
                title: m.title || m.type || "Bakım Kaydı",
                selectedParts: m.selectedParts || m.parts || [],
                partsCost: Number(m.partsCost) || 0,
                laborCost: Number(m.laborCost) || 0,
                totalCost: Number(m.totalCost || m.cost) || 0,
                serviceName: m.serviceName || "",
                notes: m.notes || m.note || ""
              }, { merge: true });
              recoveredCount++;
            }
          }

          const oldProfileCar = await getDoc(doc(firestoreDb, `artifacts/${appId}/users/${uid}/profile/carInfo`));
          if (oldProfileCar.exists()) {
            await setDoc(doc(firestoreDb, `artifacts/${appId}/users/${uid}/aurisGarage/carInfo`), oldProfileCar.data(), { merge: true });
          }

          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (!key) continue;
            if (key.toLowerCase().includes('auris')) {
              try {
                const raw = JSON.parse(localStorage.getItem(key));
                if (!raw) continue;
                const candidates = raw.maintenances ? [raw] : Object.values(raw).filter(v => v && typeof v === 'object');
                for (const c of candidates) {
                  const dataObj = c.data || c;
                  if (Array.isArray(dataObj.maintenances)) {
                    for (const m of dataObj.maintenances) {
                      const mId = String(m.id || ('loc_' + Math.random().toString(36).substring(2, 9)));
                      await setDoc(doc(firestoreDb, `artifacts/${appId}/users/${uid}/aurisMaintenances`, mId), {
                        date: m.date || getTodayDate(),
                        km: Number(m.km) || 0,
                        title: m.title || m.type || "Bakım Kaydı",
                        selectedParts: m.selectedParts || m.parts || [],
                        totalCost: Number(m.totalCost || m.cost) || 0,
                        notes: m.notes || m.note || ""
                      }, { merge: true });
                      recoveredCount++;
                    }
                  }
                }
              } catch (e) {}
            }
          }

          if (recoveredCount > 0) {
            showMessage(`Kayıtların senkronize edildi (${recoveredCount} kayıt).`, 'success');
          }
        } catch (err) {
          console.error("Veri tarama hatası:", err);
        }
      };

      useEffect(() => {
        try {
          const app = initializeApp(firebaseConfig);
          const authInstance = getAuth(app);
          const firestoreInstance = getFirestore(app);
          setAuth(authInstance);
          setDb(firestoreInstance);
          const unsubscribe = onAuthStateChanged(authInstance, user => {
            setUserId(user ? user.uid : null);
            setIsAuthReady(true);
            if (user) {
              recoverPreviousData(firestoreInstance, user.uid);
            }
          });
          return () => unsubscribe();
        } catch (err) {
          console.error("Firebase hatası:", err);
        }
      }, []);

      useEffect(() => {
        if (!isAuthReady || !db || !userId) return;

        const infoUnsub = onSnapshot(doc(db, `artifacts/${appId}/users/${userId}/aurisGarage/carInfo`), snap => {
          if (snap.exists()) {
            setCarInfo(prev => ({ ...prev, ...snap.data() }));
          }
        });

        const maintUnsub = onSnapshot(collection(db, `artifacts/${appId}/users/${userId}/aurisMaintenances`), snap => {
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          list.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
          setMaintenances(list);
        });

        const notesUnsub = onSnapshot(collection(db, `artifacts/${appId}/users/${userId}/aurisNotes`), snap => {
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          list.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
          setNotesList(list);
        });

        const experUnsub = onSnapshot(collection(db, `artifacts/${appId}/users/${userId}/aurisExper`), snap => {
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          list.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
          setExperReports(list);
        });

        return () => { infoUnsub(); maintUnsub(); notesUnsub(); experUnsub(); };
      }, [isAuthReady, db, userId]);

      const handleLogin = async () => {
        setAuthError('');
        try {
          const finalEmail = email.includes('@') ? email.trim() : `${email.trim()}@aurisgaraj.com`;
          await signInWithEmailAndPassword(auth, finalEmail, password);
        } catch (e) {
          setAuthError('Giriş yapılamadı. E-posta/kullanıcı adı veya şifre hatalı.');
        }
      };

      const handleRegister = async () => {
        setAuthError('');
        if (password.length < 6) return setAuthError('Şifre en az 6 karakter olmalıdır.');
        try {
          const finalEmail = email.includes('@') ? email.trim() : `${email.trim()}@aurisgaraj.com`;
          await createUserWithEmailAndPassword(auth, finalEmail, password);
        } catch (e) {
          setAuthError('Kayıt oluşturulamadı veya bu kullanıcı zaten mevcut.');
        }
      };

      const handleSignOut = async () => {
        try { await signOut(auth); } catch (e) {}
      };

      const saveCarInfoToCloud = async (updatedInfo, successMsg = "Bilgiler güncellendi!") => {
        try {
          await setDoc(doc(db, `artifacts/${appId}/users/${userId}/aurisGarage/carInfo`), updatedInfo, { merge: true });
          showMessage(successMsg, 'success');
        } catch (e) {
          showMessage("Kaydedilirken hata oluştu.", "error");
        }
      };

      const togglePartSelection = (partName) => {
        const exists = maintForm.selectedParts.includes(partName);
        if (exists) {
          setConfirmation({
            message: `"${partName}" parçasını bu bakım listesinden çıkarmak istiyor musunuz?`,
            danger: true,
            onConfirm: () => {
              setMaintForm(prev => ({
                ...prev,
                selectedParts: prev.selectedParts.filter(p => p !== partName)
              }));
            }
          });
        } else {
          setMaintForm(prev => ({
            ...prev,
            selectedParts: [...prev.selectedParts, partName]
          }));
        }
      };

      const addCustomPartToForm = () => {
        const val = maintForm.customPartInput.trim();
        if (!val) return;
        if (!maintForm.selectedParts.includes(val)) {
          setMaintForm(prev => ({
            ...prev,
            selectedParts: [...prev.selectedParts, val],
            customPartInput: ""
          }));
        }
      };

      const handlePartsOrLaborChange = (field, value) => {
        const updated = { ...maintForm, [field]: value };
        const pCost = Number(field === 'partsCost' ? value : maintForm.partsCost) || 0;
        const lCost = Number(field === 'laborCost' ? value : maintForm.laborCost) || 0;
        if (pCost > 0 || lCost > 0) {
          updated.totalCost = String(pCost + lCost);
        }
        setMaintForm(updated);
      };

      const handleSaveMaintenance = () => {
        if (!maintForm.date) return showMessage("Lütfen tarih girin.", "error");
        setConfirmation({
          message: editingMaintenanceId ? "Bakım kaydındaki değişiklikleri kaydetmek istiyor musunuz?" : "Yeni bakım kaydını eklemek istiyor musunuz?",
          danger: false,
          onConfirm: async () => {
            const payload = {
              date: maintForm.date,
              km: Number(maintForm.km) || Number(carInfo.currentKm) || 0,
              title: maintForm.title || "Bakım İşlemi",
              selectedParts: maintForm.selectedParts,
              partsCost: Number(maintForm.partsCost) || 0,
              laborCost: Number(maintForm.laborCost) || 0,
              totalCost: Number(maintForm.totalCost) || 0,
              serviceName: maintForm.serviceName || "",
              notes: maintForm.notes || ""
            };
            try {
              if (editingMaintenanceId) {
                await setDoc(doc(db, `artifacts/${appId}/users/${userId}/aurisMaintenances`, editingMaintenanceId), payload);
                showMessage("Bakım kaydı güncellendi!", "success");
              } else {
                await addDoc(collection(db, `artifacts/${appId}/users/${userId}/aurisMaintenances`), payload);
                if (payload.km > (Number(carInfo.currentKm) || 0)) {
                  await saveCarInfoToCloud({ ...carInfo, currentKm: payload.km, nextOilKm: payload.km + 10000 }, "Bakım eklendi ve güncel KM güncellendi!");
                } else {
                  showMessage("Yeni bakım kaydı eklendi!", "success");
                }
              }
              resetMaintForm();
              setActiveModal(null);
            } catch (e) {
              showMessage("Kayıt sırasında hata oluştu.", "error");
            }
          }
        });
      };

      const resetMaintForm = () => {
        setEditingMaintenanceId(null);
        setMaintForm({
          date: getTodayDate(),
          km: carInfo.currentKm || "",
          title: "Periyodik Bakım",
          selectedParts: [],
          customPartInput: "",
          partsCost: "",
          laborCost: "",
          totalCost: "",
          serviceName: "",
          notes: ""
        });
      };

      const openEditMaintenance = (item) => {
        setEditingMaintenanceId(item.id);
        setMaintForm({
          date: item.date || getTodayDate(),
          km: item.km || "",
          title: item.title || "Periyodik Bakım",
          selectedParts: item.selectedParts || [],
          customPartInput: "",
          partsCost: item.partsCost || "",
          laborCost: item.laborCost || "",
          totalCost: item.totalCost || "",
          serviceName: item.serviceName || "",
          notes: item.notes || ""
        });
        setActiveModal('bakim');
      };

      const handleDeleteMaintenance = (id) => {
        setConfirmation({
          message: "Bu bakım kaydını kalıcı olarak silmek istediğinizden emin misiniz?",
          danger: true,
          onConfirm: async () => {
            try {
              await deleteDoc(doc(db, `artifacts/${appId}/users/${userId}/aurisMaintenances`, id));
              showMessage("Bakım kaydı silindi.", "info");
            } catch (e) {
              showMessage("Silinirken hata oluştu.", "error");
            }
          }
        });
      };

      const handleSaveNote = () => {
        if (!noteForm.title.trim() && !noteForm.content.trim()) {
          return showMessage("Lütfen not başlığı veya içeriği yazın.", "error");
        }
        setConfirmation({
          message: editingNoteId ? "Notu güncellemek istiyor musunuz?" : "Yeni notu kaydetmek istiyor musunuz?",
          danger: false,
          onConfirm: async () => {
            const payload = {
              date: noteForm.date || getTodayDate(),
              title: noteForm.title.trim() || "Araç Notu",
              km: noteForm.km ? Number(noteForm.km) : "",
              cost: noteForm.cost ? Number(noteForm.cost) : 0,
              content: noteForm.content.trim()
            };
            try {
              if (editingNoteId) {
                await setDoc(doc(db, `artifacts/${appId}/users/${userId}/aurisNotes`, editingNoteId), payload);
                showMessage("Not güncellendi!", "success");
              } else {
                await addDoc(collection(db, `artifacts/${appId}/users/${userId}/aurisNotes`), payload);
                showMessage("Not eklendi!", "success");
              }
              setEditingNoteId(null);
              setNoteForm({ date: getTodayDate(), title: "", km: "", cost: "", content: "" });
            } catch (e) {
              showMessage("Not kaydedilemedi.", "error");
            }
          }
        });
      };

      const handleDeleteNote = (id) => {
        setConfirmation({
          message: "Bu notu silmek istediğinizden emin misiniz?",
          danger: true,
          onConfirm: async () => {
            await deleteDoc(doc(db, `artifacts/${appId}/users/${userId}/aurisNotes`, id));
            showMessage("Not silindi.", "info");
          }
        });
      };

      const handleSaveExper = () => {
        if (!experForm.firm.trim() && !experForm.summary.trim()) {
          return showMessage("Lütfen ekspertiz firması veya özet not girin.", "error");
        }
        setConfirmation({
          message: "Ekspertiz raporunu kaydetmek istiyor musunuz?",
          danger: false,
          onConfirm: async () => {
            await addDoc(collection(db, `artifacts/${appId}/users/${userId}/aurisExper`), {
              ...experForm,
              cost: Number(experForm.cost) || 0
            });
            setExperForm({ date: getTodayDate(), firm: "", km: "", cost: "", linkUrl: "", summary: "" });
            showMessage("Ekspertiz raporu kaydedildi!", "success");
          }
        });
      };

      const handleDeleteExper = (id) => {
        setConfirmation({
          message: "Bu ekspertiz raporunu silmek istediğinizden emin misiniz?",
          danger: true,
          onConfirm: async () => {
            await deleteDoc(doc(db, `artifacts/${appId}/users/${userId}/aurisExper`, id));
            showMessage("Rapor silindi.", "info");
          }
        });
      };

      const remainingOilKm = (Number(carInfo.nextOilKm) || 0) - (Number(carInfo.currentKm) || 0);
      const totalMaintenanceSpend = maintenances.reduce((acc, item) => acc + (Number(item.totalCost) || 0), 0);
      const totalNotesSpend = notesList.reduce((acc, item) => acc + (Number(item.cost) || 0), 0);
      const changedOrPaintedParts = BODY_PARTS.filter(bp => carInfo.bodyParts?.[bp.id] && carInfo.bodyParts[bp.id] !== "Orijinal");

      // Muayene ve Sigorta Geri Sayım Bilgileri
      const inspectionCountdown = getCountdownDetails(carInfo.nextInspection);
      const insuranceCountdown = getCountdownDetails(carInfo.insuranceEnd);

      if (!isAuthReady) {
        return <div className="min-h-screen flex items-center justify-center text-emerald-300 text-lg font-medium">Yükleniyor...</div>;
      }

      if (!userId) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="glass-panel p-8 sm:p-10 rounded-3xl w-full max-w-md text-center">
              <AurisLogo size="w-20 h-20" />
              <h1 className="text-3xl font-extrabold font-montserrat elegant-title-gold mb-1">Auris Garaj</h1>
              <p className="text-xs italic elegant-subtitle mb-6">2016 Toyota Auris 1.33 Life • Dijital Bakım & Not Defteri</p>
              
              <h2 className="text-lg font-semibold text-gray-200 mb-5">{isLoginMode ? 'Hesabına Giriş Yap' : 'Yeni Hesap Oluştur'}</h2>
              {authError && <p className="text-rose-400 text-sm mb-4 bg-rose-950/50 border border-rose-800/50 p-2.5 rounded-xl">{authError}</p>}
              
              <input 
                type="text" 
                placeholder="E-posta veya Kullanıcı Adı" 
                className="input-dark w-full p-3.5 mb-3.5 rounded-xl text-sm" 
                value={email} 
                onChange={(e) => setEmail(e.target.value)} 
              />
              <input 
                type="password" 
                placeholder="Şifre" 
                className="input-dark w-full p-3.5 mb-6 rounded-xl text-sm" 
                value={password} 
                onChange={(e) => setPassword(e.target.value)} 
                onKeyPress={(e) => e.key === 'Enter' && (isLoginMode ? handleLogin() : handleRegister())}
              />
              
              <button 
                onClick={isLoginMode ? handleLogin : handleRegister} 
                className="btn-black w-full py-3.5 rounded-xl font-bold text-base tracking-wide text-amber-300 border-amber-700/50"
              >
                {isLoginMode ? 'GİRİŞ YAP' : 'KAYDOL'}
              </button>
              
              <p className="text-center mt-6 text-sm"> 
                <button onClick={() => { setIsLoginMode(!isLoginMode); setAuthError(''); }} className="text-emerald-400 hover:text-emerald-300 hover:underline transition-all">
                  {isLoginMode ? 'Hesabın yok mu? Yeni kayıt oluştur.' : 'Zaten hesabın var mı? Giriş yap.'}
                </button> 
              </p>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen py-6 sm:py-10 px-3 sm:px-6">
          {message && (
            <div className={`fixed top-5 left-1/2 -translate-x-1/2 px-6 py-3.5 rounded-2xl shadow-2xl z-[100] text-sm font-semibold border ${

              message.type === 'info' ? 'bg-sky-950/95 text-sky-200 border-sky-500/50' :

              {message.content}
            </div>

            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[90] p-4">

                <div className="flex justify-center gap-3">
                  <button onClick={() => setConfirmation(null)} className="px-6 py-2.5 bg-gray-800 text-gray-300 font-semibold rounded-xl hover:bg-gray-700 text-sm">İptal</button>
                  <button 
                    onClick={() => { confirmation.onConfirm(); setConfirmation(null); }} 
                    className={`px-6 py-2.5 text-white font-bold rounded-xl text-sm ${confirmation.danger ? 'bg-rose-600 hover:bg-rose-500' : 'bg-emerald-600 hover:bg-emerald-500'}`}
                  >
                    Onayla
                  </button>
                </div>
              </div>
            </div>
          )}

          <div className="max-w-5xl mx-auto glass-panel p-5 sm:p-8 rounded-3xl relative">
            <div className="text-center border-b border-emerald-900/40 pb-6 mb-6">
              <AurisLogo size="w-16 h-16" />
              <h1 className="text-3xl sm:text-4xl font-extrabold font-montserrat elegant-title-gold tracking-tight">
                {carInfo.carTitle}
              </h1>
              <p className="text-xs sm:text-sm elegant-subtitle mt-1.5 font-medium">
                {carInfo.plate ? `Plaka: ${carInfo.plate} • ` : ''}{carInfo.color} • 1NR-FE 99 PS
              </p>
            </div>

            {/* ÖZET KARTLARI (MUAYENE GERİ SAYIMI EKLENDİ) */}
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3.5 sm:gap-4 mb-7">
              <div onClick={() => setActiveModal('ayarlar')} className="elegant-card p-4 cursor-pointer">
                <span className="text-[11px] uppercase tracking-wider text-gray-400 font-semibold block mb-1">Güncel Kilometre</span>
                <p className="text-xl sm:text-2xl font-extrabold text-white">{Number(carInfo.currentKm || 0).toLocaleString('tr-TR')} <span className="text-xs font-normal text-emerald-400">km</span></p>
                <span className="text-[11px] text-emerald-400/80 mt-1.5 block">Güncellemek için dokun →</span>
              </div>

              <div onClick={() => { resetMaintForm(); setActiveModal('bakim'); }} className="elegant-card p-4 cursor-pointer">
                <span className="text-[11px] uppercase tracking-wider text-gray-400 font-semibold block mb-1">Sonraki Bakım</span>
                <p className={`text-xl sm:text-2xl font-extrabold ${remainingOilKm <= 1000 ? 'text-amber-400' : 'text-emerald-300'}`}>
                  {remainingOilKm > 0 ? `${remainingOilKm.toLocaleString('tr-TR')} km` : 'Bakım Geldi!'}
                </p>
                <span className="text-[11px] text-gray-400 mt-1.5 block">Hedef: {Number(carInfo.nextOilKm || 0).toLocaleString('tr-TR')} km</span>
              </div>

              <div onClick={() => setActiveModal('vergi')} className="elegant-card p-4 cursor-pointer">
                <div className="flex justify-between items-center mb-1">
                  <span className="text-[11px] uppercase tracking-wider text-gray-400 font-semibold">Muayene Geri Sayım</span>
                  <span className="text-[10px] text-gray-400">{formatDisplayDate(carInfo.nextInspection)}</span>
                </div>
                <p className={`text-lg sm:text-xl font-extrabold ${inspectionCountdown.textClass}`}>
                  ⏳ {inspectionCountdown.label}
                </p>
                <div className="flex items-center justify-between gap-1 mt-1.5">
                  <span className="text-[10px] text-gray-400 truncate">
                    {inspectionCountdown.detail ? `(${inspectionCountdown.detail})` : ''}
                  </span>
                  <div className="flex gap-1">
                    <span className={`text-[9px] px-1.5 py-0.5 rounded font-semibold ${carInfo.mtv1Paid ? 'bg-emerald-900/60 text-emerald-300' : 'bg-rose-900/60 text-rose-300'}`}>
                      1.MTV {carInfo.mtv1Paid ? '✓' : '✗'}
                    </span>
                    <span className={`text-[9px] px-1.5 py-0.5 rounded font-semibold ${carInfo.mtv2Paid ? 'bg-emerald-900/60 text-emerald-300' : 'bg-rose-900/60 text-rose-300'}`}>
                      2.MTV {carInfo.mtv2Paid ? '✓' : '✗'}
                    </span>
                  </div>
                </div>
              </div>

              <div onClick={() => setActiveModal('kaporta')} className="elegant-card p-4 cursor-pointer">
                <span className="text-[11px] uppercase tracking-wider text-gray-400 font-semibold block mb-1">Kaporta & Harcama</span>
                <p className="text-lg sm:text-xl font-extrabold text-amber-300">{formatCurrency(totalMaintenanceSpend + totalNotesSpend)}</p>
                <span className="text-[11px] text-gray-400 mt-1.5 block">
                  {changedOrPaintedParts.length === 0 ? 'Tamamı Orijinal' : `${changedOrPaintedParts.length} Parça İşlemli`}
                </span>
              </div>
            </div>

            {/* MODÜL DÜĞMELERİ */}
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5 mb-8 border-b border-emerald-900/40 pb-7">
              <button onClick={() => { resetMaintForm(); setActiveModal('bakim'); }} className="btn-black p-3.5 rounded-2xl flex flex-col items-center justify-center gap-1.5 text-center border-emerald-700/50">
                <span className="text-lg">🔧</span>
                <span className="text-xs font-bold text-emerald-300">+ Bakım & Parça</span>
              </button>

              <button onClick={() => setActiveModal('notlar')} className="btn-black p-3.5 rounded-2xl flex flex-col items-center justify-center gap-1.5 text-center border-amber-700/50">
                <span className="text-lg">📝</span>
                <span className="text-xs font-bold text-amber-300">Notlarım ({notesList.length})</span>
              </button>

              <button onClick={() => setActiveModal('kaporta')} className="btn-black p-3.5 rounded-2xl flex flex-col items-center justify-center gap-1.5 text-center">
                <span className="text-lg">🚗</span>
                <span className="text-xs font-bold">Boya & Değişen</span>
              </button>

              <button onClick={() => setActiveModal('vergi')} className="btn-black p-3.5 rounded-2xl flex flex-col items-center justify-center gap-1.5 text-center">
                <span className="text-lg">📅</span>
                <span className="text-xs font-bold">Muayene & Vergi</span>
              </button>

              <button onClick={() => setActiveModal('exper')} className="btn-black p-3.5 rounded-2xl flex flex-col items-center justify-center gap-1.5 text-center">
                <span className="text-lg">📋</span>
                <span className="text-xs font-bold">Ekspertiz ({experReports.length})</span>
              </button>

              <button onClick={() => setActiveModal('ayarlar')} className="btn-black p-3.5 rounded-2xl flex flex-col items-center justify-center gap-1.5 text-center">
                <span className="text-lg">⚙️</span>
                <span className="text-xs font-bold text-gray-300">KM & Ayarlar</span>
              </button>
            </div>

            {/* BAKIM LİSTESİ */}
            <div className="space-y-6">
              <div>
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg sm:text-xl font-bold text-white flex items-center gap-2">
                    <span>Bakım ve Değişen Parça Geçmişi</span>
                    <span className="text-xs bg-emerald-900/50 text-emerald-300 px-2.5 py-0.5 rounded-full border border-emerald-700/40">{maintenances.length}</span>
                  </h2>
                  <button onClick={() => recoverPreviousData(db, userId)} className="text-xs text-amber-300 hover:underline">
                    🔄 Eski Kayıtları Tara / Getir
                  </button>
                </div>

                {maintenances.length > 0 ? (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {maintenances.map(item => (
                      <div key={item.id} className="elegant-card p-5 flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between items-start gap-2 mb-2">
                            <div>
                              <h3 className="text-base font-bold text-white">{item.title}</h3>
                              <p className="text-xs text-emerald-400 font-medium">
                                {formatDisplayDate(item.date)} • {Number(item.km || 0).toLocaleString('tr-TR')} km
                                {item.serviceName ? ` • ${item.serviceName}` : ''}
                              </p>
                            </div>
                            <span className="bg-amber-500/15 border border-amber-500/40 text-amber-300 text-xs font-bold px-3 py-1 rounded-xl whitespace-nowrap">
                              {formatCurrency(item.totalCost)}
                            </span>
                          </div>

                          {item.selectedParts && item.selectedParts.length > 0 && (
                            <div className="flex flex-wrap gap-1.5 my-3">
                              {item.selectedParts.map((part, idx) => (
                                <span key={idx} className="text-[11px] bg-black/50 text-gray-200 px-2.5 py-1 rounded-lg border border-emerald-900/60">
                                  ✓ {part}
                                </span>
                              ))}
                            </div>
                          )}

                          {item.notes && (
                            <p className="text-xs text-gray-300 italic bg-black/30 p-2.5 rounded-xl border border-white/5 mt-2">
                              "{item.notes}"

                        </div>

                        <div className="flex justify-end gap-2 mt-4 pt-3 border-t border-white/5">
                          <button onClick={() => openEditMaintenance(item)} className="btn-black px-3 py-1.5 rounded-lg text-xs font-semibold text-emerald-400">Düzenle</button>
                          <button onClick={() => handleDeleteMaintenance(item.id)} className="btn-black px-3 py-1.5 rounded-lg text-xs font-semibold text-rose-400">Sil</button>
                        </div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="text-center py-10 bg-black/20 rounded-2xl border border-dashed border-emerald-900/40">
                    <p className="text-gray-400 text-sm">Henüz bakım kaydı görünmüyor. "+ Bakım & Parça" düğmesinden ekleyebilir veya sağ üstteki "Eski Kayıtları Tara" düğmesine basabilirsin.</p>
                  </div>
                )}
              </div>

              {notesList.length > 0 && (
                <div className="pt-4 border-t border-emerald-900/40">
                  <div className="flex justify-between items-center mb-3">
                    <h2 className="text-base sm:text-lg font-bold text-amber-300">Son Araç Notlarım</h2>
                    <button onClick={() => setActiveModal('notlar')} className="text-xs text-emerald-400 hover:underline">+ Yeni Not Ekle</button>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {notesList.slice(0, 4).map(n => (
                      <div key={n.id} onClick={() => setActiveModal('notlar')} className="elegant-card p-4 cursor-pointer">
                        <div className="flex justify-between items-center mb-1">
                          <span className="font-bold text-sm text-white">{n.title}</span>
                          <span className="text-[11px] text-gray-400">{formatDisplayDate(n.date)}</span>
                        </div>
                        <p className="text-xs text-gray-300 line-clamp-2">{n.content}</p>
                        {Number(n.cost) > 0 && <span className="text-[11px] text-amber-300 font-semibold mt-1.5 block">Tutar: {formatCurrency(n.cost)}</span>}
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>

          {activeModal === 'bakim' && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center z-50 p-3 sm:p-6 overflow-y-auto" onClick={(e) => e.target === e.currentTarget && setActiveModal(null)}>
              <div className="glass-panel p-5 sm:p-8 rounded-3xl w-full max-w-2xl max-h-[92vh] overflow-y-auto modal-scroll my-auto">
                <div className="flex justify-between items-center pb-4 mb-5 border-b border-emerald-900/50">
                  <h2 className="text-xl sm:text-2xl font-bold elegant-title-gold">
                    {editingMaintenanceId ? 'Bakım Kaydını Düzenle' : 'Yeni Bakım & Parça Kaydı'}
                  </h2>
                  <button onClick={() => setActiveModal(null)} className="btn-black w-9 h-9 rounded-full text-xl">&times;</button>
                </div>

                <div className="mb-5">
                  <label className="block text-xs text-gray-400 mb-2 font-semibold uppercase tracking-wider">Hazır Bakım Şablonu Seç (Tek Tıkla Doldur):</label>

                      🛢️ 10.000 KM Periyodik
                    </button>
                    <button type="button" onClick={() => setMaintForm({...maintForm, title: "Volan, Debriyaj & Şanzıman Yağı Bakımı", selectedParts: QUICK_TEMPLATES.sanzimanVolan})} className="btn-black px-3 py-2 rounded-xl text-xs font-semibold text-amber-300 border-amber-700/50">
                      ⚙️ Volan + Debriyaj + Şanzıman Yağı
                    </button>
                    <button type="button" onClick={() => setMaintForm({...maintForm, title: "Ağır Bakım", selectedParts: QUICK_TEMPLATES.agirBakim})} className="btn-black px-3 py-2 rounded-xl text-xs font-semibold text-sky-300">
                      ⚡ Ağır Bakım (Buji/Kayış/Sıvılar)
                    </button>
                    <button type="button" onClick={() => setMaintForm({...maintForm, title: "Fren Bakımı", selectedParts: QUICK_TEMPLATES.frenTakim})} className="btn-black px-3 py-2 rounded-xl text-xs font-semibold text-rose-300">
                      🛑 Fren Disk & Balata
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                  <div>
                    <label className="block text-xs text-gray-300 mb-1 font-medium">Bakım Başlığı</label>
                    <input type="text" className="input-dark w-full p-3 rounded-xl text-sm" value={maintForm.title} onChange={(e) => setMaintForm({...maintForm, title: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-xs text-gray-300 mb-1 font-medium">Tarih</label>
                    <input type="date" className="input-dark w-full p-3 rounded-xl text-sm" value={maintForm.date} onChange={(e) => setMaintForm({...maintForm, date: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-xs text-gray-300 mb-1 font-medium">Yapıldığı KM</label>
                    <input type="number" className="input-dark w-full p-3 rounded-xl text-sm" value={maintForm.km} onChange={(e) => setMaintForm({...maintForm, km: e.target.value})} />
                  </div>
                </div>

                <div className="mb-4">
                  <label className="block text-xs text-gray-300 mb-2 font-semibold">Değişen / İşlem Gören Parçalar (Tıkla Seç):</label>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-52 overflow-y-auto modal-scroll bg-black/40 p-3 rounded-2xl border border-emerald-900/40">
                    {PREDEFINED_PARTS.map((part, i) => {
                      const isChecked = maintForm.selectedParts.includes(part.name);
                      return (
                        <div 
                          key={i} 
                          onClick={() => togglePartSelection(part.name)}
                          className={`p-2.5 rounded-xl border text-xs cursor-pointer flex items-center justify-between transition-all ${
                            isChecked ? 'bg-emerald-950/80 border-emerald-500 text-white font-semibold' : 'bg-black/30 border-white/5 text-gray-300 hover:border-white/20'
                          }`}
                        >
                          <span>{part.name}</span>
                          <span className="text-[10px] text-emerald-400">{isChecked ? '✓ Seçili' : '+'}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="flex gap-2 mb-5">
                  <input 
                    type="text" 
                    placeholder="Listede olmayan başka bir parça varsa yazıp ekle..." 
                    className="input-dark flex-1 p-2.5 rounded-xl text-xs"
                    value={maintForm.customPartInput}
                    onChange={(e) => setMaintForm({...maintForm, customPartInput: e.target.value})}
                    onKeyPress={(e) => e.key === 'Enter' && addCustomPartToForm()}
                  />
                  <button type="button" onClick={addCustomPartToForm} className="btn-black px-4 py-2.5 rounded-xl text-xs font-bold text-emerald-300">+ Parça Ekle</button>
                </div>

                <div className="bg-black/35 p-4 rounded-2xl border border-amber-500/20 mb-4">
                  <label className="block text-xs font-bold text-amber-300 mb-3">💶 Tutar Bilgileri (Manuel Giriş)</label>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label className="block text-[11px] text-gray-400 mb-1">Parça Tutarı (₺)</label>
                      <input type="number" placeholder="Ör: 3500" className="input-dark w-full p-2.5 rounded-xl text-sm" value={maintForm.partsCost} onChange={(e) => handlePartsOrLaborChange('partsCost', e.target.value)} />
                    </div>
                    <div>
                      <label className="block text-[11px] text-gray-400 mb-1">İşçilik Tutarı (₺)</label>
                      <input type="number" placeholder="Ör: 1500" className="input-dark w-full p-2.5 rounded-xl text-sm" value={maintForm.laborCost} onChange={(e) => handlePartsOrLaborChange('laborCost', e.target.value)} />
                    </div>
                    <div>
                      <label className="block text-[11px] text-amber-300 font-bold mb-1">Toplam Tutar (₺) *</label>
                      <input type="number" placeholder="Doğrudan toplam yaz..." className="input-dark w-full p-2.5 rounded-xl text-sm font-bold border-amber-500/50 text-amber-200" value={maintForm.totalCost} onChange={(e) => setMaintForm({...maintForm, totalCost: e.target.value})} />
                    </div>
                  </div>
                </div>

                <div className="space-y-3 mb-6">
                  <div>
                    <label className="block text-xs text-gray-300 mb-1">Servis / Usta Adı</label>
                    <input type="text" placeholder="Ör: Özel Toyota Servisi" className="input-dark w-full p-3 rounded-xl text-sm" value={maintForm.serviceName} onChange={(e) => setMaintForm({...maintForm, serviceName: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-xs text-gray-300 mb-1">Bakım Notun</label>
                    <textarea rows="3" placeholder="Kullanılan yağ markası, değişen parçaların markası veya usta notu..." className="input-dark w-full p-3 rounded-xl text-sm" value={maintForm.notes} onChange={(e) => setMaintForm({...maintForm, notes: e.target.value})}></textarea>
                  </div>
                </div>

                <button onClick={handleSaveMaintenance} className="btn-black w-full py-3.5 rounded-xl font-bold text-emerald-300 border-emerald-700/60">
                  {editingMaintenanceId ? 'Değişiklikleri Kaydet' : 'Bakım Kaydını Ekle'}
                </button>
              </div>
            </div>
          )}

          {/* NOT DEFTERİ MODALI */}
          {activeModal === 'notlar' && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center z-50 p-3 sm:p-6 overflow-y-auto" onClick={(e) => e.target === e.currentTarget && setActiveModal(null)}>
              <div className="glass-panel p-5 sm:p-8 rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-y-auto modal-scroll my-auto">
                <div className="flex justify-between items-center pb-4 mb-5 border-b border-emerald-900/50">
                  <h2 className="text-xl sm:text-2xl font-bold elegant-title-gold">📝 Araç Not Defterim</h2>
                  <button onClick={() => setActiveModal(null)} className="btn-black w-9 h-9 rounded-full text-xl">&times;</button>
                </div>

                <div className="bg-black/35 p-4 rounded-2xl border border-emerald-900/40 mb-6 space-y-3">
                  <h3 className="text-sm font-bold text-amber-300">{editingNoteId ? 'Notu Düzenle' : 'Yeni Not Ekle'}</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input type="text" placeholder="Başlık (Ör: Kışlık Lastik, Ses)" className="input-dark p-2.5 rounded-xl text-xs" value={noteForm.title} onChange={(e) => setNoteForm({...noteForm, title: e.target.value})} />
                    <input type="date" className="input-dark p-2.5 rounded-xl text-xs" value={noteForm.date} onChange={(e) => setNoteForm({...noteForm, date: e.target.value})} />
                    <input type="number" placeholder="Varsa Tutar (₺) - Manuel" className="input-dark p-2.5 rounded-xl text-xs" value={noteForm.cost} onChange={(e) => setNoteForm({...noteForm, cost: e.target.value})} />
                  </div>
                  <textarea rows="3" placeholder="Aracınla ilgili her türlü notu buraya yazabilirsin..." className="input-dark w-full p-3 rounded-xl text-xs" value={noteForm.content} onChange={(e) => setNoteForm({...noteForm, content: e.target.value})}></textarea>
                  <button onClick={handleSaveNote} className="btn-black w-full py-2.5 rounded-xl text-xs font-bold text-emerald-300">
                    {editingNoteId ? 'Notu Güncelle' : '+ Notu Kaydet'}
                  </button>
                </div>

                <div className="space-y-3">
                  {notesList.map(n => (
                    <div key={n.id} className="elegant-card p-4 flex justify-between gap-3">
                      <div>
                        <div className="flex items-center gap-2 mb-1">
                          <h4 className="font-bold text-white text-sm">{n.title}</h4>
                          <span className="text-[11px] text-gray-400">({formatDisplayDate(n.date)})</span>
                          {Number(n.cost) > 0 && <span className="text-xs font-bold text-amber-300 bg-amber-950/60 px-2 py-0.5 rounded-lg">{formatCurrency(n.cost)}</span>}
                        </div>
                        <p className="text-xs text-gray-200 whitespace-pre-line">{n.content}</p>
                      </div>
                      <div className="flex gap-1.5 self-start">
                        <button onClick={() => { setEditingNoteId(n.id); setNoteForm({ date: n.date, title: n.title, km: n.km || "", cost: n.cost || "", content: n.content }); }} className="btn-black px-3 py-1.5 rounded-lg text-xs text-emerald-300">Düzenle</button>
                        <button onClick={() => handleDeleteNote(n.id)} className="btn-black px-3 py-1.5 rounded-lg text-xs text-rose-400">Sil</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* KAPORTA MODALI */}
          {activeModal === 'kaporta' && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center z-50 p-3 sm:p-6 overflow-y-auto" onClick={(e) => e.target === e.currentTarget && setActiveModal(null)}>
              <div className="glass-panel p-5 sm:p-8 rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-y-auto modal-scroll my-auto">
                <div className="flex justify-between items-center pb-4 mb-5 border-b border-emerald-900/50">
                  <h2 className="text-xl sm:text-2xl font-bold elegant-title-gold">🚗 Boya & Değişen Durumu</h2>
                  <button onClick={() => setActiveModal(null)} className="btn-black w-9 h-9 rounded-full text-xl">&times;</button>
                </div>
                <div className="space-y-2.5">
                  {BODY_PARTS.map(part => {
                    const currentStatus = carInfo.bodyParts?.[part.id] || "Orijinal";
                    return (
                      <div key={part.id} className="elegant-card p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <span className="text-xs sm:text-sm font-semibold text-white">{part.label}</span>
                        <div className="flex flex-wrap gap-1.5">
                          {PAINT_STATUSES.map(st => (
                            <button
                              key={st.value}
                              onClick={() => {
                                const updated = { ...carInfo, bodyParts: { ...(carInfo.bodyParts || {}), [part.id]: st.value } };
                                setCarInfo(updated);
                                saveCarInfoToCloud(updated, `${part.label}: ${st.value} kaydedildi.`);
                              }}
                              className={`px-2.5 py-1 rounded-lg text-[11px] font-semibold border transition-all ${
                                currentStatus === st.value ? st.color + ' scale-105' : 'bg-black/40 text-gray-400 border-white/5'
                              }`}
                            >
                              {st.value}
                            </button>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* VERGİ & MUAYENE GERİ SAYIM MODALI */}
          {activeModal === 'vergi' && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center z-50 p-3 sm:p-6 overflow-y-auto" onClick={(e) => e.target === e.currentTarget && setActiveModal(null)}>
              <div className="glass-panel p-5 sm:p-8 rounded-3xl w-full max-w-lg my-auto">
                <div className="flex justify-between items-center pb-4 mb-5 border-b border-emerald-900/50">
                  <h2 className="text-xl font-bold elegant-title-gold">📅 Muayene, Sigorta & MTV</h2>
                  <button onClick={() => setActiveModal(null)} className="btn-black w-9 h-9 rounded-full text-xl">&times;</button>
                </div>

                {/* Canlı Geri Sayım Kutusu */}
                <div className="grid grid-cols-2 gap-3 mb-5">
                  <div className={`p-3.5 rounded-2xl border ${inspectionCountdown.badgeClass}`}>
                    <span className="text-[10px] uppercase font-bold tracking-wider block opacity-80">TÜVTÜRK Muayene</span>
                    <p className="text-base sm:text-lg font-extrabold mt-0.5">⏳ {inspectionCountdown.label}</p>
                    <span className="text-[11px] opacity-90 block mt-0.5">{inspectionCountdown.detail} ({formatDisplayDate(carInfo.nextInspection)})</span>
                  </div>
                  <div className={`p-3.5 rounded-2xl border ${insuranceCountdown.badgeClass}`}>
                    <span className="text-[10px] uppercase font-bold tracking-wider block opacity-80">Trafik Sigortası</span>
                    <p className="text-base sm:text-lg font-extrabold mt-0.5">🛡️ {insuranceCountdown.label}</p>
                    <span className="text-[11px] opacity-90 block mt-0.5">{insuranceCountdown.detail} ({formatDisplayDate(carInfo.insuranceEnd)})</span>
                  </div>
                </div>

                <div className="space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-gray-300 mb-1">Son Yapılan Muayene Tarihi</label>
                      <input 
                        type="date" 
                        className="input-dark w-full p-3 rounded-xl text-sm" 
                        value={carInfo.lastInspection || ''} 
                        onChange={(e) => {
                          const d = e.target.value;
                          let nextD = carInfo.nextInspection;
                          if (d) {
                            const parts = d.split('-');
                            if (parts.length === 3) {
                              nextD = `${Number(parts[0]) + 2}-${parts[1]}-${parts[2]}`;
                            }
                          }
                          setCarInfo({...carInfo, lastInspection: d, nextInspection: nextD});
                        }} 
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-emerald-300 font-bold mb-1">Gelecek Muayene Tarihi (+2 Yıl)</label>
                      <input type="date" className="input-dark w-full p-3 rounded-xl text-sm border-emerald-500/50" value={carInfo.nextInspection || ''} onChange={(e) => setCarInfo({...carInfo, nextInspection: e.target.value})} />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs text-gray-300 mb-1">Trafik Sigortası Bitiş Tarihi</label>
                    <input type="date" className="input-dark w-full p-3 rounded-xl text-sm" value={carInfo.insuranceEnd || ''} onChange={(e) => setCarInfo({...carInfo, insuranceEnd: e.target.value})} />
                  </div>
                  <div className="p-4 bg-black/35 rounded-2xl border border-emerald-900/40 space-y-3">
                    <div className="flex items-center justify-between gap-3">
                      <button type="button" onClick={() => setCarInfo({...carInfo, mtv1Paid: !carInfo.mtv1Paid})} className={`px-3.5 py-2 rounded-xl text-xs font-bold border flex-1 text-left ${carInfo.mtv1Paid ? 'bg-emerald-950/80 border-emerald-500 text-emerald-300' : 'bg-rose-950/60 border-rose-700 text-rose-300'}`}>
                        Ocak 1. Taksit: {carInfo.mtv1Paid ? 'ÖDENDİ ✓' : 'ÖDENMEDİ ✗'}
                      </button>
                      <input type="number" placeholder="Tutar (₺)" className="input-dark w-28 p-2 rounded-xl text-xs" value={carInfo.mtv1Amount || ''} onChange={(e) => setCarInfo({...carInfo, mtv1Amount: e.target.value})} />
                    </div>
                    <div className="flex items-center justify-between gap-3">
                      <button type="button" onClick={() => setCarInfo({...carInfo, mtv2Paid: !carInfo.mtv2Paid})} className={`px-3.5 py-2 rounded-xl text-xs font-bold border flex-1 text-left ${carInfo.mtv2Paid ? 'bg-emerald-950/80 border-emerald-500 text-emerald-300' : 'bg-rose-950/60 border-rose-700 text-rose-300'}`}>
                        Temmuz 2. Taksit: {carInfo.mtv2Paid ? 'ÖDENDİ ✓' : 'ÖDENMEDİ ✗'}
                      </button>
                      <input type="number" placeholder="Tutar (₺)" className="input-dark w-28 p-2 rounded-xl text-xs" value={carInfo.mtv2Amount || ''} onChange={(e) => setCarInfo({...carInfo, mtv2Amount: e.target.value})} />
                    </div>
                  </div>
                  <button onClick={() => { saveCarInfoToCloud(carInfo); setActiveModal(null); }} className="btn-black w-full py-3.5 rounded-xl font-bold text-emerald-300">Kaydet</button>
                </div>
              </div>
            </div>
          )}

          {/* EKSPERTİZ MODALI */}
          {activeModal === 'exper' && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center z-50 p-3 sm:p-6 overflow-y-auto" onClick={(e) => e.target === e.currentTarget && setActiveModal(null)}>
              <div className="glass-panel p-5 sm:p-8 rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-y-auto modal-scroll my-auto">
                <div className="flex justify-between items-center pb-4 mb-5 border-b border-emerald-900/50">
                  <h2 className="text-xl font-bold elegant-title-gold">📋 Ekspertiz Raporları</h2>
                  <button onClick={() => setActiveModal(null)} className="btn-black w-9 h-9 rounded-full text-xl">&times;</button>
                </div>
                <div className="bg-black/35 p-4 rounded-2xl border border-emerald-900/40 mb-6 space-y-3">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input type="text" placeholder="Ekspertiz Firması" className="input-dark p-2.5 rounded-xl text-xs" value={experForm.firm} onChange={(e) => setExperForm({...experForm, firm: e.target.value})} />
                    <input type="date" className="input-dark p-2.5 rounded-xl text-xs" value={experForm.date} onChange={(e) => setExperForm({...experForm, date: e.target.value})} />
                    <input type="number" placeholder="Ücret Tutarı (₺)" className="input-dark p-2.5 rounded-xl text-xs" value={experForm.cost} onChange={(e) => setExperForm({...experForm, cost: e.target.value})} />
                  </div>
                  <input type="text" placeholder="Rapor Linki (Google Drive vb.)" className="input-dark w-full p-2.5 rounded-xl text-xs" value={experForm.linkUrl} onChange={(e) => setExperForm({...experForm, linkUrl: e.target.value})} />
                  <textarea rows="2" placeholder="Rapor özeti ve notlar..." className="input-dark w-full p-2.5 rounded-xl text-xs" value={experForm.summary} onChange={(e) => setExperForm({...experForm, summary: e.target.value})}></textarea>
                  <button onClick={handleSaveExper} className="btn-black w-full py-2.5 rounded-xl text-xs font-bold text-emerald-300">+ Raporu Kaydet</button>
                </div>
                <div className="space-y-3">
                  {experReports.map(rep => (
                    <div key={rep.id} className="elegant-card p-4 flex justify-between items-start gap-3">
                      <div>
                        <h4 className="font-bold text-white text-sm">{rep.firm} ({formatDisplayDate(rep.date)})</h4>
                        <p className="text-xs text-gray-300 mt-1">{rep.summary}</p>
                      </div>
                      <button onClick={() => handleDeleteExper(rep.id)} className="btn-black px-3 py-1.5 rounded-lg text-xs text-rose-400">Sil</button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* AYARLAR MODALI */}
          {activeModal === 'ayarlar' && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center z-50 p-3 sm:p-6 overflow-y-auto" onClick={(e) => e.target === e.currentTarget && setActiveModal(null)}>
              <div className="glass-panel p-5 sm:p-8 rounded-3xl w-full max-w-md my-auto">
                <div className="flex justify-between items-center pb-4 mb-5 border-b border-emerald-900/50">
                  <h2 className="text-xl font-bold elegant-title-gold">⚙️ KM & Araç Ayarları</h2>
                  <button onClick={() => setActiveModal(null)} className="btn-black w-9 h-9 rounded-full text-xl">&times;</button>
                </div>
                <div className="space-y-4">
                  <div>
                    <label className="block text-xs text-emerald-300 font-bold mb-1">Güncel Kilometre (KM)</label>
                    <input type="number" className="input-dark w-full p-3 rounded-xl text-base font-bold" value={carInfo.currentKm} onChange={(e) => setCarInfo({...carInfo, currentKm: Number(e.target.value)})} />
                  </div>
                  <div>
                    <label className="block text-xs text-gray-300 mb-1">Gelecek Yağ Bakımı Hedef KM</label>
                    <input type="number" className="input-dark w-full p-3 rounded-xl text-sm" value={carInfo.nextOilKm} onChange={(e) => setCarInfo({...carInfo, nextOilKm: Number(e.target.value)})} />
                  </div>
                  <div>
                    <label className="block text-xs text-gray-300 mb-1">Plaka</label>
                    <input type="text" className="input-dark w-full p-3 rounded-xl text-sm uppercase" value={carInfo.plate} onChange={(e) => setCarInfo({...carInfo, plate: e.target.value.toUpperCase()})} />
                  </div>
                  <button onClick={() => { saveCarInfoToCloud(carInfo); setActiveModal(null); }} className="btn-black w-full py-3.5 rounded-xl font-bold text-emerald-300">Kaydet</button>
                  <button onClick={handleSignOut} className="btn-black w-full py-3 rounded-xl font-semibold text-rose-400 border-rose-900/50 text-xs mt-4">Çıkış Yap</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const startApp = () => {
      if (window.firebaseAPI) {
        ReactDOM.render(<App />, document.getElementById('root'));
      } else {
        setTimeout(startApp, 50);
      }
    };
    startApp();
  </script>
</body>
</html>
