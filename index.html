  <style>
    /* BUNKO KOYU ÇAM YEŞİLİ TEMA CSS */
    body {
        font-family: 'Inter', sans-serif;
        background: #0d1b15;
        background-attachment: fixed;
        color: #e2e8f0;
        min-height: 100vh;
    }
    
    h1, h2, h3.font-montserrat {
        font-family: 'Montserrat', sans-serif;
    }

    /* Neon Sarı Başlık Efekti */
    .neon-title-yellow {
        color: #ffffff;
        text-shadow: 
            0 0 2px #ffffff, 
            0 0 7px #fef08a, 
            0 0 15px #eab308, 
            0 0 30px #ca8a04, 
            0 0 60px #a16207;
    }

    /* Neon Turkuaz Alıntı Efekti */
    .neon-turquoise {
        color: #ffffff;
        text-shadow: 
            0 0 2px #ffffff, 
            0 0 8px #5fc2c0, 
            0 0 16px #1e8689, 
            0 0 32px #0d5c5f, 
            0 0 60px #083c3e;
    }

    /* İkon Parlama Efekti */
    .bunko-icon-glow {
        filter: drop-shadow(0 0 15px rgba(30, 134, 137, 0.55));
        transition: transform 0.3s ease, filter 0.3s ease;
    }
    .bunko-icon-glow:hover {
        transform: scale(1.04);
        filter: drop-shadow(0 0 22px rgba(234, 179, 8, 0.65));
    }

    /* Cam / Koyu Yeşil Panel Efekti */
    .glass-panel {
        background: rgba(13, 31, 23, 0.90);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(52, 211, 153, 0.15);
        box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.85);
    }

    /* Siyah / Koyu Yeşil Butonlar */
    .btn-black {
        background-color: #08100d;
        color: #ffffff;
        border: 1px solid #1c3529;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 4px 6px rgba(0,0,0,0.4);
        transition: all 0.3s ease;
    }
    .btn-black:hover:not(:disabled) {
        background-color: #12261d;
        border-color: #eab308;
        box-shadow: 0 0 12px rgba(234, 179, 8, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
        transform: translateY(-2px);
    }
    .btn-black:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* Bakım & Özet Kartları */
    .garage-card {
        background: linear-gradient(145deg, #132d22, #08100d);
        border: 2px solid rgba(255, 255, 255, 0.85);
        border-radius: 16px;
        box-shadow: 5px 5px 15px rgba(0,0,0,0.7), inset -2px 0 5px rgba(255,255,255,0.08);
        position: relative;
        overflow: hidden;
    }

    /* Girdi Kutuları */
    .input-dark {
        background-color: rgba(6, 15, 11, 0.75);
        border: 1px solid #234233;
        color: #ffffff;
        transition: all 0.3s ease;
    }
    .input-dark:focus {
        border-color: #eab308;
        box-shadow: 0 0 8px rgba(234, 179, 8, 0.4);
        outline: none;
    }

    /* SVG Kaporta Parçaları */
    .car-part {
        transition: all 0.2s ease;
        cursor: pointer;
        stroke: #08100d;
        stroke-width: 2.5px;
    }
    .car-part:hover {
        filter: brightness(1.2);
        stroke: #ffffff !important;
        stroke-width: 3px;
    }
    .car-part.selected-part {
        stroke: #fef08a !important;
        stroke-width: 4px;
        filter: drop-shadow(0 0 8px rgba(234, 179, 8, 0.85));
    }

    /* Ekspertiz Durum Renkleri */
    .status-orijinal { fill: #10b981; } /* Yeşil */
    .status-lokal { fill: #eab308; }    /* Sarı */
    .status-boyali { fill: #f97316; }   /* Turuncu */
    .status-degisen { fill: #ef4444; }  /* Kırmızı */
    .status-soktak { fill: #3b82f6; }   /* Mavi */
    .status-plastik { fill: #8b5cf6; }  /* Mor */

    /* Kaydırma çubuğu stilleri */
    .modal-scroll::-webkit-scrollbar { width: 8px; }
    .modal-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 10px; }
    .modal-scroll::-webkit-scrollbar-thumb { background: #234233; border-radius: 10px; }
    .modal-scroll::-webkit-scrollbar-thumb:hover { background: #325e49; }
  </style>
</head>
<body>

  <div id="root"></div>

  <!-- Firebase JS modules (Bunko ile birebir aynı sürüm ve yapı) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
    import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js";
    window.firebaseAPI = { 
        initializeApp, 
        getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged,
        getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, getDocs, writeBatch
    };
  </script>

  <!-- React Uygulaması -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // 2016 Toyota Auris 1.33 Life Hazır Parça Kataloğu ve Şablonları
    const AURIS_PARTS_CATALOG = [
      { id: 'yag', name: 'Motor Yağı (3.5 Litre)', defaultSpec: '5W-30 / 0W-20 Tam Sentetik', defaultCost: 1350, templates: ['periyodik10k', 'agirBakim'] },
      { id: 'yagFiltre', name: 'Yağ Filtresi (Kağıt İçi)', defaultSpec: 'Mann / Filtron / Orijinal', defaultCost: 280, templates: ['periyodik10k', 'agirBakim'] },
      { id: 'havaFiltre', name: 'Hava Filtresi', defaultSpec: 'Mann / Filtron', defaultCost: 350, templates: ['periyodik10k', 'agirBakim'] },
      { id: 'polenFiltre', name: 'Polen (Kabin) Filtresi', defaultSpec: 'Karbonlu', defaultCost: 320, templates: ['periyodik10k', 'agirBakim'] },
      { id: 'karterTapa', name: 'Karter Tapası ve Contası', defaultSpec: 'Orijinal', defaultCost: 100, templates: ['periyodik10k', 'agirBakim'] },
      { id: 'buji', name: 'İridyum Buji Takımı (4 Adet)', defaultSpec: 'Denso SC16HR11 / SC20HR11', defaultCost: 1850, templates: ['agirBakim'] },
      { id: 'sanzimanYag', name: '6 İleri Manuel Şanzıman Yağı', defaultSpec: '75W LV GL-4 (2L)', defaultCost: 1400, templates: ['agirBakim'] },
      { id: 'vKayisi', name: 'V Kayışı (Alternatör Kayışı)', defaultSpec: 'Gates / Continental', defaultCost: 650, templates: ['agirBakim'] },
      { id: 'frenHidrolik', name: 'Fren Hidrolik Sıvısı', defaultSpec: 'DOT 4', defaultCost: 450, templates: ['agirBakim', 'frenOnTakim'] },
      { id: 'antifriz', name: 'Pembe Organik Antifriz', defaultSpec: 'Toyota SLLC', defaultCost: 850, templates: ['agirBakim', 'kisAku'] },
      { id: 'onBalata', name: 'Ön Fren Balata Takımı', defaultSpec: 'Bosch / TRW / Textar', defaultCost: 1250, templates: ['frenOnTakim'] },
      { id: 'arkaBalata', name: 'Arka Fren Balata Takımı', defaultSpec: 'Bosch / TRW', defaultCost: 1050, templates: ['frenOnTakim'] },
      { id: 'onDisk', name: 'Ön Fren Diskleri (Çift)', defaultSpec: 'TRW / Brembo', defaultCost: 2600, templates: ['frenOnTakim'] },
      { id: 'arkaDisk', name: 'Arka Fren Diskleri (Çift)', defaultSpec: 'TRW / Bosch', defaultCost: 2200, templates: [] },
      { id: 'zRot', name: 'Ön Z Rotlar (Askı Rotu Sağ/Sol)', defaultSpec: 'Lemförder / Delphi', defaultCost: 900, templates: ['frenOnTakim'] },
      { id: 'salincak', name: 'Ön Salıncak / Burçlar', defaultSpec: 'Lemförder', defaultCost: 2400, templates: [] },
      { id: 'amortisor', name: 'Amortisör & Takoz Kontrol/Değişim', defaultSpec: 'KYB (Kayaba)', defaultCost: 3800, templates: [] },
      { id: 'debriyaj', name: 'Debriyaj Seti (Baskı-Balata-Bilya)', defaultSpec: 'Aisin / Valeo', defaultCost: 5800, templates: ['kisAku'] },
      { id: 'aku', name: 'Akü (12V 60Ah)', defaultSpec: 'Varta / Mutlu', defaultCost: 3400, templates: ['kisAku'] },
      { id: 'silecek', name: 'Ön & Arka Silecek Süpürge Seti', defaultSpec: 'Bosch AeroTwin', defaultCost: 650, templates: ['kisAku'] },
      { id: 'klimaGaz', name: 'Klima Gazı Dolumu & Dezenfeksiyon', defaultSpec: 'R134a', defaultCost: 1100, templates: [] },
      { id: 'rotBalans', name: 'Rot & Balans Ayarı', defaultSpec: '3D Lazer', defaultCost: 600, templates: ['frenOnTakim'] },
      { id: 'lastik', name: 'Lastik Değişimi (205/55 R16)', defaultSpec: '4 Mevsim / Yaz / Kış', defaultCost: 1500, templates: [] },
      { id: 'ampul', name: 'Far / Stop Ampul Değişimi', defaultSpec: 'HIR2 9012 / W5W', defaultCost: 450, templates: [] }
    ];

    // 13 Kaporta Parçası İsimleri
    const CAR_PANELS_META = {
      onTampon: 'Ön Tampon',
      onKaput: 'Ön Kaput',
      tavan: 'Tavan',
      bagajKapagi: 'Bagaj Kapağı',
      arkaTampon: 'Arka Tampon',
      solOnCamurluk: 'Sol Ön Çamurluk',
      solOnKapi: 'Sol Ön Kapı',
      solArkaKapi: 'Sol Arka Kapı',
      solArkaCamurluk: 'Sol Arka Çamurluk',
      sagOnCamurluk: 'Sağ Ön Çamurluk',
      sagOnKapi: 'Sağ Ön Kapı',
      sagArkaKapi: 'Sağ Arka Kapı',
      sagArkaCamurluk: 'Sağ Arka Çamurluk'
    };

    // Şasi, Podye, Direk ve Airbag Kontrol Kalemleri
    const STRUCTURAL_PARTS_META = {
      solSasi: 'Sol Ön Şasi Ucu',
      sagSasi: 'Sağ Ön Şasi Ucu',
      solPodye: 'Sol Podye',
      sagPodye: 'Sağ Podye',
      direkler: 'A / B / C Direkleri',
      airbagler: 'Airbag (Hava Yastıkları)',
      bagajHavuzu: 'Bagaj Havuz Sacı'
    };

    const DEFAULT_VEHICLE_STATE = {
      carTitle: '2016 Toyota Auris 1.33 Life',
      plate: '16 AUR 2016',
      color: 'Füme (Kahverengi)',
      currentKm: 115000,
      lastTuvDate: '2025-08-15',
      nextTuvDate: '2027-08-15',
      exhaustDate: '2027-08-15',
      trafficInsuranceEnd: '2027-05-15',
      trafficCompany: 'Allianz Sigorta',
      kaskoEnd: '',
      mtvYear: 2026,
      mtv1Paid: true,
      mtv1Amount: 1850,
      mtv2Paid: false,
      mtv2Amount: 1850,
      panels: Object.keys(CAR_PANELS_META).reduce((acc, k) => {
        acc[k] = { status: 'Orijinal', micron: '105 µm', note: '' };
        return acc;
      }, {}),
      structural: Object.keys(STRUCTURAL_PARTS_META).reduce((acc, k) => {
        acc[k] = 'Orijinal';
        return acc;
      }, {})
    };

    function AurisLogo({ size = "w-24 h-24" }) {
      return (
        <div className="flex justify-center mb-4">
          <svg className={`${size} bunko-icon-glow`} viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="6" width="128" height="128" rx="32" fill="#1E8689" stroke="#ffffff" strokeWidth="2" strokeOpacity="0.25" />
            <g stroke="#0D383C" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
              {/* Auris Hatchback Silüeti */}
              <path d="M22 82 L36 52 C40 45 48 42 58 42 L84 42 C94 42 101 46 105 53 L118 82 L118 98 C118 102 114 105 110 105 L102 105 C98 105 95 102 95 98 L95 93 L45 93 L45 98 C45 102 42 105 38 105 L30 105 C26 105 22 102 22 98 Z" fill="#FDF8E4" />
              {/* Ön Cam */}
              <path d="M42 54 L98 54 L106 72 L34 72 Z" fill="#1C777B" />
              {/* Ön Izgara & Toyota Arma Yeri */}
              <path d="M46 82 L94 82 L90 89 L50 89 Z" fill="#0D383C" />
              {/* Keen Look Farlar */}
              <polygon points="26,76 44,78 42,85 25,83" fill="#eab308" />
              <polygon points="114,76 96,78 98,85 115,83" fill="#eab308" />
              <circle cx="70" cy="79" r="4.5" fill="#eab308" />
            </g>
          </svg>
        </div>
      );
    }

    function App() {
      const { 
          initializeApp, 
          getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged,
          getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot
      } = window.firebaseAPI;

      // BUNKO İLE BİREBİR AYNI FIREBASE YAPILANDIRMASI
      const firebaseConfig = {
        apiKey: "AIzaSyCbXDdwnz0LNU7IXr4KO__usfkjYYaHJpo",
        authDomain: "okudugumkitaplarapp.firebaseapp.com",
        projectId: "okudugumkitaplarapp",
        storageBucket: "okudugumkitaplarapp.firebasestorage.app",
        messagingSenderId: "292934565697",
        appId: "1:292934565697:web:a0cdc4cbc951faceccebc0",
        measurementId: "G-V0EFGVV2CR"
      };
      const appId = firebaseConfig.projectId;

      const [db, setDb] = useState(null);
      const [auth, setAuth] = useState(null);
      const [userId, setUserId] = useState(null);
      const [userEmail, setUserEmail] = useState('');
      const [isAuthReady, setIsAuthReady] = useState(false);

      // Giriş / Kayıt State'leri (Bunko ile aynı)
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isLoginMode, setIsLoginMode] = useState(true);
      const [authError, setAuthError] = useState('');
      const [message, setMessage] = useState(null);
      const [confirmation, setConfirmation] = useState(null);

      // Araç Durumu ve Kayıt Koleksiyonları
      const [vehicle, setVehicle] = useState(DEFAULT_VEHICLE_STATE);
      const [maintenances, setMaintenances] = useState([]);
      const [reports, setReports] = useState([]);

      // Açılır Pencere (Modal) Kutucuk State'leri
      const [showKmModal, setShowKmModal] = useState(false);
      const [showMaintModal, setShowMaintModal] = useState(false);
      const [showExpertiseModal, setShowExpertiseModal] = useState(false);
      const [showLegalModal, setShowLegalModal] = useState(false);
      const [showReportsModal, setShowReportsModal] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);

      // Ana Ekran Bakım Listesi Filtre & Görünüm
      const [viewMode, setViewMode] = useState('grid');
      const [filterTerm, setFilterTerm] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('');

      // KM Düzenleme State
      const [tempKm, setTempKm] = useState(115000);

      // Bakım Ekleme / Düzenleme Modalı State'leri
      const [editingMaintId, setEditingMaintId] = useState(null);
      const [maintDate, setMaintDate] = useState('');
      const [maintKm, setMaintKm] = useState(115000);
      const [maintCategory, setMaintCategory] = useState('Periyodik Bakım');
      const [maintService, setMaintService] = useState('');
      const [maintLabor, setMaintLabor] = useState(0);
      const [maintNote, setMaintNote] = useState('');
      const [selectedPartsMap, setSelectedPartsMap] = useState({});
      const [customPartsList, setCustomPartsList] = useState([]);
      const [newCustomPart, setNewCustomPart] = useState({ name: '', spec: '', cost: '' });

      // Boya & Değişen Şeması State'i
      const [selectedPartKey, setSelectedPartKey] = useState('onKaput');
      const [partMicronInput, setPartMicronInput] = useState('105 µm');
      const [partNoteInput, setPartNoteInput] = useState('');

      // Ekspertiz Raporu / Belge Ekleme State'leri
      const [reportTitle, setReportTitle] = useState('');
      const [reportDate, setReportDate] = useState('');
      const [reportStation, setReportStation] = useState('');
      const [reportNotes, setReportNotes] = useState('');
      const [reportFileData, setReportFileData] = useState('');
      const [reportFileName, setReportFileName] = useState('');
      const [previewReport, setPreviewReport] = useState(null);

      const getTodayDate = () => {
        const today = new Date();
        return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      };

      const formatDisplayDate = (dateString) => {
        if (!dateString) return 'Belirtilmedi';
        const parts = dateString.split('-');
        if (parts.length === 3) return `${parts[2]}.${parts[1]}.${parts[0]}`;
        return dateString;
      };

      const showMessage = (content, type = 'success') => {
        setMessage({ content, type });
        setTimeout(() => setMessage(null), 4000);
      };

      // Firebase Başlatma
      useEffect(() => {
        try {
          const app = initializeApp(firebaseConfig);
          const authInstance = getAuth(app);
          const firestoreInstance = getFirestore(app);
          setAuth(authInstance);
          setDb(firestoreInstance);
          const unsubscribe = onAuthStateChanged(authInstance, user => {
            setUserId(user ? user.uid : null);
            setUserEmail(user ? (user.email || '') : '');
            setIsAuthReady(true);
          });
          return () => unsubscribe();
        } catch (err) {
          console.error("Firebase başlatılamadı.", err);
        }
      }, []);

      // Firestore Gerçek Zamanlı Dinleme (Her Cihazda Otomatik Eşitlenir)
      useEffect(() => {
        if (!isAuthReady || !db || !userId) return;

        const stateDocRef = doc(db, `artifacts/${appId}/users/${userId}/aurisGarage/vehicleState`);
        const unsubState = onSnapshot(stateDocRef, docSnap => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            setVehicle(prev => ({
              ...DEFAULT_VEHICLE_STATE,
              ...data,
              panels: { ...DEFAULT_VEHICLE_STATE.panels, ...(data.panels || {}) },
              structural: { ...DEFAULT_VEHICLE_STATE.structural, ...(data.structural || {}) }
            }));
          } else {
            setDoc(stateDocRef, DEFAULT_VEHICLE_STATE, { merge: true });
          }
        });

        const unsubMaint = onSnapshot(collection(db, `artifacts/${appId}/users/${userId}/aurisMaintenances`), snap => {
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          list.sort((a, b) => (Number(b.km) || 0) - (Number(a.km) || 0));
          setMaintenances(list);
        });

        const unsubReports = onSnapshot(collection(db, `artifacts/${appId}/users/${userId}/aurisReports`), snap => {
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          list.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
          setReports(list);
        });

        return () => {
          unsubState();
          unsubMaint();
          unsubReports();
        };
      }, [isAuthReady, db, userId]);

      // Seçili kaporta parçası değiştiğinde inputları doldur
      useEffect(() => {
        const panelObj = vehicle.panels?.[selectedPartKey] || { status: 'Orijinal', micron: '105 µm', note: '' };
        setPartMicronInput(panelObj.micron || '');
        setPartNoteInput(panelObj.note || '');
      }, [selectedPartKey, vehicle.panels]);

      // E-posta veya sadece kullanıcı adı girilse bile otomatik tamamla
      const normalizeEmailInput = (rawInput) => {
        const trimmed = (rawInput || '').trim().toLowerCase();
        if (!trimmed) return '';
        return trimmed.includes('@') ? trimmed : `${trimmed}@aurisgaraj.com`;
      };

      const handleLogin = async () => {
        setAuthError('');
        const finalEmail = normalizeEmailInput(email);
        if (!finalEmail || !password) {
          setAuthError('Lütfen e-posta (veya kullanıcı adı) ve şifrenizi girin.');
          return;
        }
        try {
          await signInWithEmailAndPassword(auth, finalEmail, password);
          showMessage('Giriş başarılı!', 'success');
        } catch (e) {
          setAuthError('Hatalı e-posta/kullanıcı adı veya şifre.');
        }
      };

      const handleRegister = async () => {
        setAuthError('');
        const finalEmail = normalizeEmailInput(email);
        if (!finalEmail || !password || password.length < 6) {
          setAuthError('Şifre en az 6 karakter olmalıdır.');
          return;
        }
        try {
          await createUserWithEmailAndPassword(auth, finalEmail, password);
          showMessage('Hesabınız oluşturuldu ve buluta kaydedildi!', 'success');
        } catch (e) {
          setAuthError('Kayıt başarısız. Bu hesap zaten kayıtlı olabilir.');
        }
      };

      const handleSignOut = () => {
        setConfirmation({
          title: 'Çıkış Yapılsın mı?',
          message: 'Oturumunuz kapatılacak ve giriş ekranına dönülecektir.',
          confirmText: 'Evet, Çıkış Yap',
          danger: true,
          onConfirm: async () => {
            try {
              await signOut(auth);
              setMaintenances([]);
              setReports([]);
            } catch (e) {}
          }
        });
      };

      // Araç durumunu Firestore'a kaydetme yardımcı fonksiyonu
      const saveVehicleState = async (updatedFields, successToast = 'Bilgiler güncellendi!') => {
        if (!db || !userId) return;
        try {
          const stateDocRef = doc(db, `artifacts/${appId}/users/${userId}/aurisGarage/vehicleState`);
          await setDoc(stateDocRef, updatedFields, { merge: true });
          if (successToast) showMessage(successToast, 'success');
        } catch (e) {
          showMessage('Kaydedilirken bir hata oluştu.', 'error');
        }
      };

      // 1. KİLOMETRE GÜNCELLEME (ONAYLI)
      const handleSaveKm = () => {
        const newKmVal = Number(tempKm);
        if (!newKmVal || newKmVal < 0) return showMessage('Geçerli bir kilometre girin.', 'error');
        setConfirmation({
          title: 'Kilometre Güncellensin mi?',
          message: `Aracınızın güncel kilometresi ${newKmVal.toLocaleString('tr-TR')} KM olarak kaydedilecektir. Onaylıyor musunuz?`,
          confirmText: 'Evet, Güncelle',
          danger: false,
          onConfirm: async () => {
            await saveVehicleState({ currentKm: newKmVal }, 'Kilometre güncellendi!');
            setShowKmModal(false);
          }
        });
      };

      // 2. MTV VERGİ TAKSİT DURUMU DEĞİŞTİRME (ONAYLI)
      const handleToggleMtv = (installmentNo) => {
        const isFirst = installmentNo === 1;
        const currentStatus = isFirst ? vehicle.mtv1Paid : vehicle.mtv2Paid;
        const nextStatusText = !currentStatus ? 'ÖDENDİ' : 'ÖDENMEDİ';

        setConfirmation({
          title: `MTV ${installmentNo}. Taksit Durumu Değişsin mi?`,
          message: `${vehicle.mtvYear} yılı ${installmentNo}. Taksit (${isFirst ? 'Ocak' : 'Temmuz'}) durumunu "${nextStatusText}" olarak işaretlemek istiyor musunuz?`,
          confirmText: 'Evet, Değiştir',
          danger: false,
          onConfirm: async () => {
            if (isFirst) {
              await saveVehicleState({ mtv1Paid: !currentStatus }, 'MTV 1. Taksit durumu güncellendi!');
            } else {
              await saveVehicleState({ mtv2Paid: !currentStatus }, 'MTV 2. Taksit durumu güncellendi!');
            }
          }
        });
      };

      // 3. BAKIM FORMU HAZIRLAMA VE ŞABLON UYGULAMA
      const openNewMaintenanceModal = () => {
        setEditingMaintId(null);
        setMaintDate(getTodayDate());
        setMaintKm(vehicle.currentKm || 115000);
        setMaintCategory('Periyodik Bakım');
        setMaintService('');
        setMaintLabor(1000);
        setMaintNote('');
        const initialMap = {};
        AURIS_PARTS_CATALOG.forEach(p => {
          initialMap[p.id] = { checked: p.templates.includes('periyodik10k'), spec: p.defaultSpec, cost: p.defaultCost };
        });
        setSelectedPartsMap(initialMap);
        setCustomPartsList([]);
        setShowMaintModal(true);
      };

      const openEditMaintenanceModal = (record) => {
        setEditingMaintId(record.id);
        setMaintDate(record.date || getTodayDate());
        setMaintKm(record.km || vehicle.currentKm);
        setMaintCategory(record.category || 'Periyodik Bakım');
        setMaintService(record.service || '');
        setMaintLabor(record.labor || 0);
        setMaintNote(record.note || '');

        const map = {};
        AURIS_PARTS_CATALOG.forEach(p => {
          map[p.id] = { checked: false, spec: p.defaultSpec, cost: p.defaultCost };
        });
        const customs = [];

        (record.parts || []).forEach(partItem => {
          const catalogMatch = AURIS_PARTS_CATALOG.find(c => c.name === partItem.name);
          if (catalogMatch) {
            map[catalogMatch.id] = { checked: true, spec: partItem.spec || catalogMatch.defaultSpec, cost: Number(partItem.cost) || 0 };
          } else {
            customs.push({ id: Math.random().toString(36).slice(2), name: partItem.name, spec: partItem.spec || '', cost: Number(partItem.cost) || 0 });
          }
        });

        setSelectedPartsMap(map);
        setCustomPartsList(customs);
        setShowMaintModal(true);
      };

      const applyMaintTemplate = (tplKey) => {
        const nextMap = { ...selectedPartsMap };
        AURIS_PARTS_CATALOG.forEach(p => {
          nextMap[p.id] = {
            ...(nextMap[p.id] || { spec: p.defaultSpec, cost: p.defaultCost }),
            checked: p.templates.includes(tplKey)
          };
        });
        setSelectedPartsMap(nextMap);
        if (tplKey === 'periyodik10k') { setMaintCategory('Periyodik Bakım'); setMaintLabor(1000); }
        if (tplKey === 'agirBakim') { setMaintCategory('Ağır Bakım'); setMaintLabor(2500); }
        if (tplKey === 'frenOnTakim') { setMaintCategory('Fren & Ön Takım'); setMaintLabor(1800); }
        if (tplKey === 'kisAku') { setMaintCategory('Debriyaj & Kışlık'); setMaintLabor(3500); }
        showMessage('Hazır Auris 1.33 parça şablonu işaretlendi!', 'info');
      };

      // Parça kutucuğunu kaldırırken (çıkartırken) onay sor
      const handleToggleCatalogPart = (part) => {
        const currentObj = selectedPartsMap[part.id] || { checked: false, spec: part.defaultSpec, cost: part.defaultCost };
        if (currentObj.checked) {
          setConfirmation({
            title: 'Parça Listeden Çıkartılsın mı?',
            message: `"${part.name}" parçasını bu bakım kaydından çıkartmak istediğinize emin misiniz?`,
            confirmText: 'Evet, Çıkart',
            danger: true,
            onConfirm: () => {
              setSelectedPartsMap(prev => ({
                ...prev,
                [part.id]: { ...currentObj, checked: false }
              }));
            }
          });
        } else {
          setSelectedPartsMap(prev => ({
            ...prev,
            [part.id]: { ...currentObj, checked: true }
          }));
        }
      };

      const handleAddCustomPart = () => {
        if (!newCustomPart.name.trim()) return showMessage('Özel parça adını yazın.', 'error');
        setCustomPartsList(prev => [
          ...prev,
          { id: Math.random().toString(36).slice(2), name: newCustomPart.name.trim(), spec: newCustomPart.spec.trim() || 'Özel', cost: Number(newCustomPart.cost) || 0 }
        ]);
        setNewCustomPart({ name: '', spec: '', cost: '' });
      };

      const handleRemoveCustomPart = (partObj) => {
        setConfirmation({
          title: 'Özel Parça Çıkartılsın mı?',
          message: `"${partObj.name}" kalemini listeden çıkartmak istiyor musunuz?`,
          confirmText: 'Evet, Çıkart',
          danger: true,
          onConfirm: () => {
            setCustomPartsList(prev => prev.filter(x => x.id !== partObj.id));
          }
        });
      };

      const calculateMaintTotal = () => {
        let sum = Number(maintLabor) || 0;
        AURIS_PARTS_CATALOG.forEach(p => {
          if (selectedPartsMap[p.id]?.checked) {
            sum += Number(selectedPartsMap[p.id]?.cost) || 0;
          }
        });
        customPartsList.forEach(cp => {
          sum += Number(cp.cost) || 0;
        });
        return sum;
      };

      const handleSaveMaintenance = () => {
        const finalParts = [];
        AURIS_PARTS_CATALOG.forEach(p => {
          if (selectedPartsMap[p.id]?.checked) {
            finalParts.push({
              name: p.name,
              spec: selectedPartsMap[p.id]?.spec || '',
              cost: Number(selectedPartsMap[p.id]?.cost) || 0
            });
          }
        });
        customPartsList.forEach(cp => {
          finalParts.push({ name: cp.name, spec: cp.spec, cost: Number(cp.cost) || 0 });
        });

        if (finalParts.length === 0) {
          return showMessage('Lütfen en az bir değişen parça veya işlem işaretleyin.', 'error');
        }

        const totalCost = calculateMaintTotal();
        const kmNum = Number(maintKm) || vehicle.currentKm;

        setConfirmation({
          title: editingMaintId ? 'Bakım Kaydı Güncellensin mi?' : 'Yeni Bakım Kaydı Eklensin mi?',
          message: `${kmNum.toLocaleString('tr-TR')} KM tarihli "${maintCategory}" (${finalParts.length} parça, Toplam: ${totalCost.toLocaleString('tr-TR')} ₺) kaydını onaylıyor musunuz?`,
          confirmText: 'Evet, Kaydet',
          danger: false,
          onConfirm: async () => {
            const payload = {
              date: maintDate || getTodayDate(),
              km: kmNum,
              category: maintCategory,
              service: maintService.trim() || 'Özel Toyota Servisi',
              labor: Number(maintLabor) || 0,
              totalCost,
              note: maintNote.trim(),
              parts: finalParts
            };

            try {
              if (editingMaintId) {
                await setDoc(doc(db, `artifacts/${appId}/users/${userId}/aurisMaintenances`, editingMaintId), payload);
                showMessage('Bakım kaydı güncellendi!', 'success');
              } else {
                await addDoc(collection(db, `artifacts/${appId}/users/${userId}/aurisMaintenances`), payload);
                showMessage('Yeni bakım kaydı eklendi!', 'success');
              }
              if (kmNum > (vehicle.currentKm || 0)) {
                await saveVehicleState({ currentKm: kmNum }, null);
              }
              setShowMaintModal(false);
            } catch (e) {
              showMessage('Bakım kaydedilirken hata oluştu.', 'error');
            }
          }
        });
      };

      const handleDeleteMaintenance = (record) => {
        setConfirmation({
          title: 'Bakım Kaydı Silinsin mi?',
          message: `${Number(record.km).toLocaleString('tr-TR')} KM'deki "${record.category}" kaydını silmek istediğinizden emin misiniz?`,
          confirmText: 'Evet, Sil',
          danger: true,
          onConfirm: async () => {
            try {
              await deleteDoc(doc(db, `artifacts/${appId}/users/${userId}/aurisMaintenances`, record.id));
              showMessage('Bakım kaydı silindi.', 'info');
            } catch (e) {
              showMessage('Silinirken hata oluştu.', 'error');
            }
          }
        });
      };

      // 4. KAPORTA BOYA & DEĞİŞEN DURUMU GÜNCELLEME (ONAYLI)
      const getStatusSvgClass = (status) => {
        if (status === 'Lokal Boyalı') return 'status-lokal';
        if (status === 'Boyalı') return 'status-boyali';
        if (status === 'Değişen') return 'status-degisen';
        if (status === 'Sök-Tak / Ayar') return 'status-soktak';
        if (status === 'Plastik / Rötuş') return 'status-plastik';
        return 'status-orijinal';
      };

      const handleUpdatePanelStatus = (newStatus) => {
        const partLabel = CAR_PANELS_META[selectedPartKey];
        setConfirmation({
          title: 'Kaporta Durumu Güncellensin mi?',
          message: `"${partLabel}" parçasının durumunu "${newStatus}" olarak kaydetmek istiyor musunuz?`,
          confirmText: 'Evet, Kaydet',
          danger: false,
          onConfirm: async () => {
            const updatedPanels = {
              ...(vehicle.panels || {}),
              [selectedPartKey]: {
                status: newStatus,
                micron: partMicronInput.trim() || '105 µm',
                note: partNoteInput.trim()
              }
            };
            await saveVehicleState({ panels: updatedPanels }, `${partLabel}: ${newStatus} olarak kaydedildi!`);
          }
        });
      };

      const handleUpdateStructuralStatus = (structKey, newVal) => {
        const label = STRUCTURAL_PARTS_META[structKey];
        setConfirmation({
          title: 'Şasi / İç Kısım Güncellensin mi?',
          message: `"${label}" durumunu "${newVal}" olarak değiştirmek istiyor musunuz?`,
          confirmText: 'Evet, Güncelle',
          danger: false,
          onConfirm: async () => {
            const updatedStruct = { ...(vehicle.structural || {}), [structKey]: newVal };
            await saveVehicleState({ structural: updatedStruct }, `${label} güncellendi!`);
          }
        });
      };

      // 5. EKSPERTİZ RAPORU EKLEME / SİLME (ONAYLI)
      const handleReportFileSelect = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (file.size > 750 * 1024) {
          showMessage('Bulut senkronizasyonu için lütfen 750 KB altı görsel/PDF seçin veya özet not yazın.', 'info');
          return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
          setReportFileData(ev.target.result);
          setReportFileName(file.name);
        };
        reader.readAsDataURL(file);
      };

      const handleAddReport = () => {
        if (!reportTitle.trim()) return showMessage('Lütfen rapor başlığı girin.', 'error');
        setConfirmation({
          title: 'Ekspertiz Raporu Eklensin mi?',
          message: `"${reportTitle}" başlıklı ekspertiz raporunu kaydetmek istiyor musunuz?`,
          confirmText: 'Evet, Ekle',
          danger: false,
          onConfirm: async () => {
            try {
              await addDoc(collection(db, `artifacts/${appId}/users/${userId}/aurisReports`), {
                title: reportTitle.trim(),
                date: reportDate || getTodayDate(),
                station: reportStation.trim() || 'Ekspertiz Merkezi',
                notes: reportNotes.trim(),
                fileName: reportFileName,
                fileData: reportFileData
              });
              setReportTitle('');
              setReportDate('');
              setReportStation('');
              setReportNotes('');
              setReportFileData('');
              setReportFileName('');
              showMessage('Ekspertiz raporu eklendi!', 'success');
            } catch (e) {
              showMessage('Rapor eklenirken hata oluştu.', 'error');
            }
          }
        });
      };

      const handleDeleteReport = (rep) => {
        setConfirmation({
          title: 'Rapor Silinsin mi?',
          message: `"${rep.title}" raporunu silmek istediğinizden emin misiniz?`,
          confirmText: 'Evet, Sil',
          danger: true,
          onConfirm: async () => {
            try {
              await deleteDoc(doc(db, `artifacts/${appId}/users/${userId}/aurisReports`, rep.id));
              showMessage('Rapor silindi.', 'info');
            } catch (e) {}
          }
        });
      };

      // Yedek Dışa Aktar (.txt)
      const exportGarageSummaryTxt = () => {
        const lines = [
          `=== ${vehicle.carTitle} (${vehicle.plate}) ===`,
          `Güncel KM: ${Number(vehicle.currentKm).toLocaleString('tr-TR')} KM`,
          `Renk: ${vehicle.color}`,
          `Son Muayene: ${formatDisplayDate(vehicle.lastTuvDate)} | Gelecek Muayene: ${formatDisplayDate(vehicle.nextTuvDate)}`,
          `Trafik Sigortası Bitiş: ${formatDisplayDate(vehicle.trafficInsuranceEnd)} (${vehicle.trafficCompany})`,
          `MTV (${vehicle.mtvYear}): 1. Taksit ${vehicle.mtv1Paid ? 'Ödendi' : 'Ödenmedi'} | 2. Taksit ${vehicle.mtv2Paid ? 'Ödendi' : 'Ödenmedi'}`,
          `\n--- KAPORTA & EKSPERTİZ DURUMU ---`,
          ...Object.entries(CAR_PANELS_META).map(([k, label]) => `${label}: ${vehicle.panels?.[k]?.status || 'Orijinal'} (${vehicle.panels?.[k]?.micron || ''}) ${vehicle.panels?.[k]?.note || ''}`),
          `\n--- BAKIM GEÇMİŞİ (${maintenances.length} Kayıt) ---`,
          ...maintenances.map(m => `${formatDisplayDate(m.date)} - ${Number(m.km).toLocaleString('tr-TR')} KM | ${m.category} (${m.service}) | Toplam: ${Number(m.totalCost).toLocaleString('tr-TR')} ₺\n  Parçalar: ${(m.parts || []).map(p => p.name).join(', ')}`)
        ];
        const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'auris_garaj_ozet.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showMessage('Araç geçmişi metin dosyası (.txt) olarak indirildi!', 'success');
      };

      // Özet Hesaplamaları
      const curKm = Number(vehicle.currentKm) || 115000;
      const lastMaintKm = maintenances.length > 0 ? Number(maintenances[0].km) : curKm - 4500;
      const nextMaintTargetKm = lastMaintKm + 10000;
      const remainingMaintKm = nextMaintTargetKm - curKm;

      const tuvDaysRemaining = vehicle.nextTuvDate
        ? Math.ceil((new Date(vehicle.nextTuvDate) - new Date()) / (1000 * 60 * 60 * 24))
        : null;

      const nonOriginalPanelsCount = Object.values(vehicle.panels || {}).filter(p => p && p.status !== 'Orijinal').length;

      const filteredMaintenances = maintenances.filter(m => {
        const matchesCat = !categoryFilter || m.category === categoryFilter;
        const q = filterTerm.toLocaleLowerCase('tr-TR');
        const matchesText = !q ||
          (m.category || '').toLocaleLowerCase('tr-TR').includes(q) ||
          (m.service || '').toLocaleLowerCase('tr-TR').includes(q) ||
          (m.note || '').toLocaleLowerCase('tr-TR').includes(q) ||
          (m.parts || []).some(p => (p.name || '').toLocaleLowerCase('tr-TR').includes(q));
        return matchesCat && matchesText;
      });

      if (!isAuthReady) {
        return <div className="min-h-screen flex items-center justify-center text-white text-xl">Yükleniyor...</div>;
      }

      // ============================================================================
      // 1. GİRİŞ EKRANI (BUNKO İLE BİREBİR AYNI TASARIM VE MİMARİ)
      // ============================================================================
      if (!userId) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            {message && (
              <div className={`fixed top-4 left-1/2 -translate-x-1/2 p-4 px-6 rounded-xl shadow-lg z-50 ${message.type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'} text-white font-semibold`}>
                {message.content}
              </div>
            )}
            <div className="glass-panel p-8 rounded-2xl w-full max-w-md text-center">
              <AurisLogo size="w-24 h-24" />
              <h1 className="text-3xl font-extrabold font-montserrat neon-title-yellow mb-2">Auris Garaj (2016)</h1>
              <p className="text-xs italic neon-turquoise mb-6">"Bakımlı bir Auris, her yolculukta ilk günkü güveni verir." • 1.33 Life</p>
              <h2 className="text-xl font-bold text-gray-200 mb-4">{isLoginMode ? 'Giriş Yap' : 'Kaydol'}</h2>
              {authError && <p className="text-red-400 text-center mb-4 font-medium text-sm">{authError}</p>}
              <input
                type="text"
                placeholder="E-posta veya Kullanıcı Adı"
                className="input-dark w-full p-3.5 mb-4 rounded-xl"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                onKeyPress={(e) => e.key === 'Enter' && (isLoginMode ? handleLogin() : handleRegister())}
              />
              <input
                type="password"
                placeholder="Şifre (En az 6 karakter)"
                className="input-dark w-full p-3.5 mb-6 rounded-xl"
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                onKeyPress={(e) => e.key === 'Enter' && (isLoginMode ? handleLogin() : handleRegister())}
              />
              <button
                onClick={isLoginMode ? handleLogin : handleRegister}
                className="btn-black w-full py-3.5 rounded-xl font-bold text-lg tracking-wide"
              >
                {isLoginMode ? 'GİRİŞ YAP' : 'KAYDOL'}
              </button>
              <p className="text-center mt-6">
                <button
                  onClick={() => { setIsLoginMode(!isLoginMode); setAuthError(''); }}
                  className="text-emerald-400 hover:text-emerald-300 hover:underline transition-all text-sm font-medium"
                >
                  {isLoginMode ? 'Hesabın yok mu? Yeni kayıt oluştur.' : 'Zaten hesabın var mı? Giriş yap.'}
                </button>
              </p>
            </div>
          </div>
        );
      }

      // ============================================================================
      // 2. ANA EKRAN (BAŞTA ÖZET BİLGİLER + TIKLAYINCA AÇILAN KUTUCUK/DÜĞMELER)
      // ============================================================================
      return (
        <div className="min-h-screen py-8 px-4 sm:px-6">
          {/* Bildirim Kutusu */}
          {message && (
            <div className={`fixed top-4 left-1/2 -translate-x-1/2 p-4 px-6 rounded-xl shadow-2xl z-[100] font-medium ${message.type === 'success' ? 'bg-emerald-600' : message.type === 'info' ? 'bg-sky-600' : 'bg-rose-600'} text-white`}>
              {message.content}
            </div>
          )}

          {/* Onay Penceresi (Ekleme, Silme, Düzenleme, Çıkartma İçin) */}
          {confirmation && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[90] p-4">
              <div className={`glass-panel p-8 rounded-2xl shadow-2xl w-full max-w-md text-center border-t-4 ${confirmation.danger ? 'border-rose-500' : 'border-emerald-500'}`}>
                <h3 className="text-xl font-bold text-white mb-3">{confirmation.title || 'Onaylıyor musunuz?'}</h3>
                <p className="text-sm text-gray-300 mb-8 leading-relaxed">{confirmation.message}</p>
                <div className="flex justify-center gap-4">
                  <button onClick={() => setConfirmation(null)} className="px-6 py-3 bg-gray-700 text-white font-semibold rounded-xl hover:bg-gray-600 transition-colors">
                    İptal Et
                  </button>
                  <button
                    onClick={() => { confirmation.onConfirm(); setConfirmation(null); }}
                    className={`px-6 py-3 text-white font-bold rounded-xl transition-all ${confirmation.danger ? 'bg-rose-600 hover:bg-rose-500' : 'bg-emerald-600 hover:bg-emerald-500'}`}
                  >
                    {confirmation.confirmText || 'Evet, Onayla'}
                  </button>
                </div>
              </div>
            </div>
          )}

          <div className="max-w-6xl mx-auto glass-panel p-5 sm:p-8 rounded-2xl relative shadow-2xl">
            
            {/* Üst Başlık ve Logo */}
            <div className="pt-2 text-center">
              <AurisLogo size="w-24 h-24 sm:w-28 sm:h-28" />
              <h1 className="text-3xl sm:text-5xl font-extrabold font-montserrat neon-title-yellow tracking-wide mb-2">
                {vehicle.carTitle}
              </h1>
              <p className="text-base sm:text-lg font-semibold neon-turquoise mb-6">
                Plaka: {vehicle.plate} • Renk: {vehicle.color}
              </p>
            </div>

            {/* ==================================================================== */}
            {/* BAŞTA 4 ÖZET BİLGİ KUTUSU (Tıklayınca İlgili Düzenleme Penceresi Açılır) */}
            {/* ==================================================================== */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
              
              {/* Özet 1: Güncel Kilometre */}
              <div
                onClick={() => { setTempKm(curKm); setShowKmModal(true); }}
                className="bg-black/50 hover:bg-black/70 p-5 rounded-2xl border border-emerald-800/60 hover:border-yellow-500 cursor-pointer transition-all"
              >
                <div className="flex justify-between items-center text-xs font-bold text-emerald-400 uppercase tracking-wider mb-1">
                  <span>Güncel Kilometre</span>
                  <span>✎ Düzenle</span>
                </div>
                <div className="text-2xl sm:text-3xl font-extrabold text-white mt-1">
                  {curKm.toLocaleString('tr-TR')} KM
                </div>
                <p className="text-xs text-gray-400 mt-2">Kilometre eklemek için tıklayın</p>
              </div>

              {/* Özet 2: Sonraki Bakım */}
              <div
                onClick={openNewMaintenanceModal}
                className="bg-black/50 hover:bg-black/70 p-5 rounded-2xl border border-emerald-800/60 hover:border-yellow-500 cursor-pointer transition-all"
              >
                <div className="flex justify-between items-center text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">
                  <span>Sonraki Bakım</span>
                  <span>+ Bakım Gir</span>
                </div>

                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const startApp = () => {
      if (window.firebaseAPI) {
        ReactDOM.render(<App />, document.getElementById('root'));
      } else {
        setTimeout(startApp, 50);
      }
    };
    startApp();
  </script>
</body>
</html>
